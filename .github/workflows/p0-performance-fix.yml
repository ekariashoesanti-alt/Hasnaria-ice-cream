name: P0 Performance Fix

on:
  push:
    paths:
      - '.github/workflows/p0-performance-fix.yml'

permissions:
  contents: write

jobs:
  apply-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply P0 patch
        run: python .github/scripts/apply_p0.py

      - name: Run ERP regression test
        run: node tests/erp-tracker.test.js

      - name: Commit P0 fixes
        run: |
          git config user.name "Hasnaria P0 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add core-app.js app.js index.html purchase-finance-alignment-v1.js xlsx-preload.js tests/erp-tracker.test.js
          if git diff --cached --quiet; then
            echo "No P0 changes needed"
            exit 0
          fi
          git commit -m "P0: remove blocking startup data loads"
          git push origin HEAD:main

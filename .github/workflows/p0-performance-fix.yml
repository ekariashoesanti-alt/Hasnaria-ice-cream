name: P1 Test Alignment

on:
  push:
    paths:
      - '.github/workflows/p0-performance-fix.yml'

permissions:
  contents: write

jobs:
  align-p1-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align ERP UI test
        run: node .github/scripts/fix-p1-erp-ui-test.js
      - name: Validate production build gate
        run: node scripts/vercel-build-check.js
      - name: Commit aligned test
        shell: bash
        run: |
          git config user.name "Hasnaria P1 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/erp-ui.test.js
          git commit -m "test(p1): align ERP UI lazy-loading contract"
          git push origin HEAD:main

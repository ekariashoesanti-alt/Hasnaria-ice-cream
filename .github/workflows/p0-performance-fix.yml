name: P1 Final Performance Fix

on:
  push:
    paths:
      - '.github/workflows/p0-performance-fix.yml'

permissions:
  contents: write

jobs:
  apply-p1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply P1 patch
        run: python .github/scripts/apply_p1.py

      - name: Validate JavaScript and ERP regression
        run: |
          node --check erp.js
          node tests/erp-tracker.test.js

      - name: Commit P1 fixes
        run: |
          git config user.name "Hasnaria P1 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add erp.js index.html tests/erp-tracker.test.js
          if git diff --cached --quiet; then
            echo "No P1 changes needed"
            exit 0
          fi
          git commit -m "P1: move Owner secondary data off critical path"
          git push origin HEAD:main

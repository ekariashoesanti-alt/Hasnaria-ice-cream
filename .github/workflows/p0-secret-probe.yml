name: P0 Supabase Admin Secret Probe

on:
  push:
    branches:
      - fix/p0-e2e-secret-redaction
    paths:
      - .github/workflows/p0-secret-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Report secret availability only
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SERVICE_ROLE}" ]] && echo "SUPABASE_SERVICE_ROLE_KEY=available" || echo "SUPABASE_SERVICE_ROLE_KEY=missing"
          [[ -n "${SECRET_KEY}" ]] && echo "SUPABASE_SECRET_KEY=available" || echo "SUPABASE_SECRET_KEY=missing"
          [[ -n "${SERVICE_KEY}" ]] && echo "SUPABASE_SERVICE_KEY=available" || echo "SUPABASE_SERVICE_KEY=missing"

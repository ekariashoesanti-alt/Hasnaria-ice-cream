name: Hasnaria Audit Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Required normalized-sales files
        shell: bash
        run: |
          set -euo pipefail
          test -s sales-import-v2.js
          test -s sales-board.js
          test -s supabase/migrations/20260906133154_sales_import_foundation.sql
          test -s supabase/migrations/20260906133258_sales_external_transaction_unique_constraint.sql
          test -s supabase/migrations/20260906150558_harden_sales_import_and_legacy_role_bridge.sql
          grep -q '__HASNARIA_IMPORT_V2' sales-board.js
          grep -q 'void/refund' sales-import-v2.js
          grep -q 'item_name' sales-import-v2.js
          grep -q 'external_sku' sales-import-v2.js

      - name: Prevent privileged-key leaks
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(service_role|sb_secret_[A-Za-z0-9_-]+)' .; then
            echo 'Privileged Supabase credential marker found in repository.' >&2
            exit 1
          fi

      - name: Validate migration safety markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enable row level security' supabase/migrations/20260906133154_sales_import_foundation.sql
          grep -q 'revoke execute on function public.bootstrap_user_profile' supabase/migrations/20260906150558_harden_sales_import_and_legacy_role_bridge.sql
          grep -q 'private.sync_legacy_roster_to_profile' supabase/migrations/20260906150558_harden_sales_import_and_legacy_role_bridge.sql

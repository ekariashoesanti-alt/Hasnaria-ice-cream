name: Hasnaria Production E2E

on:
  workflow_dispatch:
    inputs:
      allow_write:
        description: 'Run controlled Purchase write + lineage + cleanup test'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HASNARIA_BASE_URL: https://hasnaria-business-analyzer.vercel.app
      HASNARIA_E2E_EMAIL: ${{ secrets.HASNARIA_E2E_EMAIL }}
      HASNARIA_E2E_PASSWORD: ${{ secrets.HASNARIA_E2E_PASSWORD }}
      HASNARIA_E2E_ALLOW_WRITE: ${{ inputs.allow_write && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect E2E credentials
        id: creds
        shell: bash
        run: |
          if [[ -n "${HASNARIA_E2E_EMAIL}" && -n "${HASNARIA_E2E_PASSWORD}" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'E2E credential seed is available; authenticated acceptance will run.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Authenticated E2E credentials are not configured. Public production smoke will still run.'
          fi

      - name: Install isolated E2E dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0 xlsx@0.18.5
          npx playwright install --with-deps chromium

      - name: Run public production smoke
        run: npx playwright test tests/e2e/public-smoke.spec.js --reporter=line

      - name: Run authenticated production browser E2E
        if: steps.creds.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_email="${HASNARIA_E2E_EMAIL}"
          local_part="${base_email%@*}"
          domain="${base_email#*@}"
          if [[ "${base_email}" == *"@"* && "${local_part}" != *"+hasnaria-e2e" ]]; then
            export HASNARIA_E2E_EMAIL="${local_part}+hasnaria-e2e@${domain}"
          fi

          seed_hash="$(printf '%s' "${HASNARIA_E2E_PASSWORD}" | sha256sum | awk '{print $1}')"
          derived_password="HsN!${seed_hash}Aa1@"
          echo "::add-mask::${derived_password}"
          export HASNARIA_E2E_PASSWORD="${derived_password}"

          npx playwright test tests/e2e/e2e-owner-bootstrap.spec.js --reporter=line
          npx playwright test tests/e2e/go-live.spec.js tests/e2e/p0-desktop-stability.spec.js --reporter=line

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hasnaria-e2e-failure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

name: Hasnaria Singapore Schema Restore

# Manual isolated schema-only trial or restore. Never exports rows, credentials or SQL artifacts.
on:
  # Automatically validate credentials and SQL in a rolled-back transaction
  # when the dedicated restore workflow is accepted into main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/hasnaria-staging-schema.yml'
      - 'scripts/hasnaria_schema_only_actions.js'
  workflow_dispatch:
    inputs:
      confirmation:
        description: "CHECK_STAGING_SCHEMA for trial; RESTORE_SCHEMA_ONLY_SINGAPORE for permanent schema-only restore to Singapore"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: hasnaria-staging-schema-preflight
  cancel-in-progress: false

jobs:
  schema-guarded:
    environment: hasnaria-staging-schema
    if: ${{ github.repository == 'ekariashoesanti-alt/Hasnaria-ice-cream' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'CHECK_STAGING_SCHEMA' || inputs.confirmation == 'RESTORE_SCHEMA_ONLY_SINGAPORE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout approved main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          docker info --format '{{.ServerVersion}}' >/dev/null
          docker pull postgres:17 >/dev/null
          echo 'PostgreSQL 17 schema exporter ready'

      - name: Run source, project and SQL guard unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/hasnaria_schema_only_actions.js
          node scripts/hasnaria_schema_only_actions.js --self-test

      - name: Export and transactionally validate; optionally restore Singapore staging schema
        shell: bash
        env:
          HSN_PROD_READONLY_DB_URL: ${{ secrets.HSN_PROD_READONLY_DB_URL }}
          HSN_STAGING_DB_URL: ${{ secrets.HSN_STAGING_DB_URL }}
          HSN_SCHEMA_OPERATION: ${{ inputs.confirmation == 'RESTORE_SCHEMA_ONLY_SINGAPORE' && 'restore-staging' || 'validate-only' }}
          HSN_STAGING_RESTORE_APPROVED: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ -z "${HSN_PROD_READONLY_DB_URL}" || -z "${HSN_STAGING_DB_URL}" ]]; then
            echo 'BLOCK: add the two database URL repository Actions secrets before running'
            exit 1
          fi
          node scripts/hasnaria_schema_only_actions.js

# SECURITY:
# - Production connection must be a dedicated READ-ONLY PostgreSQL role.
# - Production and Singapore staging project refs are enforced in the script.
# - SQL only lives in an ephemeral GitHub runner temp folder and is deleted.
# - No upload-artifact, cache, PR/comment, git commit or logging of SQL/password.
# - Explicit protected environment approval is required for schema restore.
# - Trial rollback precedes restore; on SQL failure no partial objects are committed.
# - Do not set production credentials on staging connection or run from PR branches.

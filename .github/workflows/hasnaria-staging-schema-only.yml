name: Hasnaria Singapore Schema-Only Transfer

on:
  push:
    branches:
      - chore/hasnaria-staging-schema-actions-20261011
    paths:
      - '.github/workflows/hasnaria-staging-schema-only.yml'
      - 'scripts/hasnaria_schema_only_actions.js'
  workflow_dispatch:
    inputs:
      operation:
        description: 'validate-only first; restore-staging needs a separate explicit confirmation'
        type: choice
        required: true
        default: validate-only
        options:
          - validate-only
          - restore-staging
      restore_confirmation:
        description: 'For restore ONLY, type RESTORE_TO_SINGAPORE_STAGING'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hasnaria-staging-schema-only
  cancel-in-progress: false

jobs:
  safe-self-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline production and staging ref guards
        run: node scripts/hasnaria_schema_only_actions.js --self-test
  manual-transfer:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ekariashoesanti-alt/Hasnaria-ice-cream' && github.actor == 'ekariashoesanti-alt'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Deliberately NO upload-artifact, cache, or SQL upload. Runner is ephemeral.
    # Add required reviewers in GitHub Settings > Environments for extra approval.
    environment: hasnaria-staging-schema-only
    env:
      HSN_PROD_READONLY_DB_URL: ${{ secrets.HSN_PROD_READONLY_DB_URL }}
      HSN_STAGING_DB_URL: ${{ secrets.HSN_STAGING_DB_URL }}
      HSN_SCHEMA_OPERATION: ${{ inputs.operation }}
      HSN_RESTORE_CONFIRM: ${{ inputs.restore_confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline identity and SQL guards
        run: node scripts/hasnaria_schema_only_actions.js --self-test
      - name: Validate protected input
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HSN_PROD_READONLY_DB_URL:-}" ] || [ -z "${HSN_STAGING_DB_URL:-}" ]; then
            echo 'BLOCK: configure both database URLs as environment secrets in GitHub settings.'
            exit 1
          fi
          if [ "$HSN_SCHEMA_OPERATION" = "restore-staging" ] && [ "$HSN_RESTORE_CONFIRM" != 'RESTORE_TO_SINGAPORE_STAGING' ]; then
            echo 'BLOCK: staging restore requires exact confirmation.'
            exit 1
          fi
      - name: Prepare PostgreSQL client, Node Supabase CLI and Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          mkdir -p "$RUNNER_TEMP/hasnaria-cli"
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/hasnaria-cli" supabase@latest
          echo "$RUNNER_TEMP/hasnaria-cli/node_modules/.bin" >> "$GITHUB_PATH"
          docker info >/dev/null
      - name: Validate schema-only export and staging transaction rollback
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hasnaria_schema_only_actions.js
      - name: Confirmation
        run: echo 'Workflow finished. No SQL artifact, business records, or credentials were published.'

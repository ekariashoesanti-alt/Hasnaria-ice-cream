name: Hasnaria Preview Browser Smoke HSN-005-006
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hsn-preview-browser-smoke.yml'
      - 'tests/e2e/preview-hsn005-hsn006.spec.js'
      - 'tests/e2e/stock-compact-one-view.spec.js'
      - 'stock-control-v3.css'
permissions:
  contents: read
jobs:
  preview-browser-smoke:
    if: ${{ github.event.pull_request.head.ref == 'test/hsn005-hsn006-integrated-20261102' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test the exact PR's compiled app with an isolated staging tenant; no Vercel bypass.
      HASNARIA_BASE_URL: http://127.0.0.1:4173
      HASNARIA_P0_STAGING_PREVIEW: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail-closed staging-only production-equivalent build
        run: |
          set -euo pipefail
          node scripts/vercel-build.js
          test -s dist/index.html
          test -s dist/sales-board.js
      - name: Install isolated browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server for compiled staging artifact
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/hasnaria-preview-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then exit 0; fi
            sleep 1
          done
          cat /tmp/hasnaria-preview-http.log
          exit 1
      - name: Chromium smoke of compiled staging preview (no credentials)
        run: npx playwright test tests/e2e/public-smoke.spec.js tests/e2e/preview-hsn005-hsn006.spec.js tests/e2e/stock-compact-one-view.spec.js --reporter=line --workers=1
      - name: Upload failure diagnostics (no authenticated state)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hsn-preview-browser-smoke-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 2

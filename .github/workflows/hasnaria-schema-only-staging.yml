name: Hasnaria Schema-Only Staging (Manual)

# Intentionally no push, pull_request, schedule, or artifacts: production credentials
# must never be available to code from an untrusted PR in this PUBLIC repository.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate first; restore needs a separate, explicit manual run'
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - restore-staging
      restore_confirmation:
        description: 'For restore only: type RESTORE_TO_SINGAPORE_STAGING'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hasnaria-production-schema-export
  cancel-in-progress: false

jobs:
  schema-only:
    name: Protected schema-only check and optional Singapore restore
    if: github.repository == 'ekariashoesanti-alt/Hasnaria-ice-cream' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: hasnaria-schema-staging

    steps:
      - name: Checkout reviewed main branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check schema sync helper safety (no network)
        run: node scripts/hasnaria_schema_only_actions.js --self-test

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          psql --version
          docker info --format '{{.ServerVersion}}' >/dev/null

      - name: Export public and private schema only; validate/optionally restore Singapore
        shell: bash
        env:
          HSN_PROD_READONLY_DB_URL: ${{ secrets.HSN_PROD_READONLY_DB_URL }}
          HSN_STAGING_DB_URL: ${{ secrets.HSN_STAGING_DB_URL }}
          HSN_SCHEMA_OPERATION: ${{ inputs.operation }}
          HSN_RESTORE_CONFIRM: ${{ inputs.restore_confirmation }}
        run: |
          set -euo pipefail
          node scripts/hasnaria_schema_only_actions.js

      # Deliberately NO actions/upload-artifact, cache, commit or log of schema SQL.
      # The temporary dump is deleted by the helper. The repository is PUBLIC.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 887" width="1774" height="887" role="img" aria-labelledby="title desc">
  <title id="title">Hasnaria Terrace</title>
  <desc id="desc">Hasnaria Terrace logo with green leaves, white Hasnaria lettering, yellow Terrace lettering, and a thin white outline for contrast.</desc>
  <defs>
    <linearGradient id="leafLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe400"/>
      <stop offset="0.58" stop-color="#19bf00"/>
      <stop offset="1" stop-color="#078c13"/>
    </linearGradient>
    <linearGradient id="leafRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42df00"/>
      <stop offset="0.62" stop-color="#18bb00"/>
      <stop offset="1" stop-color="#078512"/>
    </linearGradient>
    <linearGradient id="terraceGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe23a"/>
      <stop offset="0.55" stop-color="#ffc91f"/>
      <stop offset="1" stop-color="#ffad00"/>
    </linearGradient>
    <filter id="softDepth" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#softDepth)" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">
    <path d="M881 351 C812 285 724 246 681 177 C651 128 653 77 661 75 C739 87 806 122 848 174 C883 218 895 281 881 351 Z" fill="url(#leafLeft)"/>
    <path d="M893 350 C927 267 987 201 1057 158 C1113 124 1157 114 1174 115 C1186 212 1145 285 1081 321 C1021 355 955 365 893 350 Z" fill="url(#leafRight)"/>
  </g>

  <path d="M879 336 C844 247 796 172 722 122 C792 151 850 207 890 310" fill="none" stroke="#a9f765" stroke-width="11" stroke-linecap="round"/>
  <path d="M895 338 C937 250 1001 189 1094 153 C1018 195 957 256 902 327" fill="none" stroke="#b8f47b" stroke-width="10" stroke-linecap="round"/>

  <text x="887" y="625" text-anchor="middle"
        font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
        font-size="244" font-weight="900" letter-spacing="-8"
        fill="#fff" stroke="#fff" stroke-width="10" paint-order="stroke fill"
        filter="url(#softDepth)">HASNARIA</text>

  <g filter="url(#softDepth)" fill="url(#terraceGold)" stroke="#fff" stroke-width="6" paint-order="stroke fill" stroke-linejoin="round">
    <rect x="144" y="763" width="158" height="38" rx="18"/>
    <rect x="1470" y="763" width="158" height="38" rx="18"/>
    <text x="887" y="833" text-anchor="middle"
          font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
          font-size="177" font-weight="900" letter-spacing="-1">TERRACE</text>
  </g>
</svg>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b55">
<title>Lupa Password · Hasnaria</title>
<link rel="stylesheet" href="/auth-recovery.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0" defer></script>
<script src="/forgot-password.js?v=1" defer></script>
</head>
<body>
<main class="recovery-card">
  <div class="recovery-brand"><div class="recovery-mark">H</div><div><b>Hasnaria</b><span>Account Recovery</span></div></div>
  <div class="recovery-kicker">Keamanan Akun</div>
  <h1>Lupa Password?</h1>
  <p class="recovery-intro">Masukkan email akun Hasnaria. Jika email terdaftar, kami akan mengirim tautan untuk membuat password baru.</p>
  <form id="forgotForm" class="recovery-form" autocomplete="off">
    <label class="recovery-label">Email akun<input id="forgotEmail" class="recovery-input" type="email" autocomplete="email" required></label>
    <button id="forgotSubmit" class="recovery-btn" type="submit">Kirim Link Reset Password</button>
  </form>
  <p id="forgotMsg" class="recovery-msg" aria-live="polite"></p>
  <div class="recovery-note">Demi keamanan, halaman ini tidak mengungkap apakah suatu email terdaftar atau tidak.</div>
  <a class="recovery-link" href="/">← Kembali ke halaman login</a>
</main>
</body>
</html>
